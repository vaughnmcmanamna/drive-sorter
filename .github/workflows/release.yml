name: Build Windows release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  windows-release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install Inno Setup
        shell: powershell
        run: choco install innosetup --yes --no-progress

      - name: Run tests
        shell: powershell
        run: python -m unittest -q

      - name: Verify tag matches application version
        if: startsWith(github.ref, 'refs/tags/')
        shell: powershell
        run: |
          $appVersion = python -c 'from version import __version__; print(__version__)'
          $expected = "v$appVersion"
          if ("${{ github.ref_name }}" -ne $expected) {
            throw "Tag ${{ github.ref_name }} does not match version.py ($expected)."
          }

      - name: Build release artifacts
        shell: powershell
        run: .\tools\build_release.ps1

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: drive-sorter-windows
          path: release/*

      - name: Publish tagged GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "${{ github.ref_name }}" *> $null
          if ($LASTEXITCODE -ne 0) {
            $notes = @'
          First public release of Drive Sorter. See CHANGELOG.md for the feature list.

          **Unsigned Windows build:** Microsoft Defender SmartScreen may show a warning. Verify downloads with `SHA256SUMS.txt`. The release will remain marked as a pre-release until its executables are code-signed.
          '@
            gh release create "${{ github.ref_name }}" --prerelease --title "Drive Sorter ${{ github.ref_name }}" --notes $notes
          }
          gh release upload "${{ github.ref_name }}" release/* --clobber
